syntax = "proto3";

package experimental.anomaly_detection.v1.generator.proto;

import "google/protobuf/duration.proto";
import "v1/generator/proto/connection_log_entry.proto";

option go_package = "github.com/GoogleCloudPlatform/alloydb-omni-samples/experimental/anomaly-detection/v1/generator/proto;generatorpb";

// Query template configuration schema for synthetic data generation tool.
message QueryTemplateConfigs {
  oneof scenario {
    WeightedSamplingConfig weighted_sampling = 1;
    BucketSamplingConfig bucket_sampling = 2;
    ConnectionSamplingConfig connection_sampling = 3;
    MarkovSamplingConfig markov_sampling = 4;        // New fourth scenario.
    MarkovSubtypeConfig markov_subtype = 5;          // New: base/override subtype.
    MarkovIndividualConfig markov_individual = 6;    // New: per-individual parameterization.
  }
}

// Directed weighted graph (Markov chain) describing a workload.
message MarkovSamplingConfig {
  repeated MarkovNode nodes = 1;
  MarkovStartNode start = 2;
  // Field 3 (formerly anomaly_profiles) is intentionally unused: the
  // reweight-profile injection model was replaced by full-graph injection.
  reserved 3;
  reserved "anomaly_profiles";
  // Manual injection: ordered, nonoverlapping ranges in the output action sequence.
  // Each injection references a separate, complete markov_sampling graph by file path.
  // Mutually exclusive with auto_injection.
  repeated MarkovInjection injections = 4;
  // Automatic injection: the generator auto-places non-overlapping anomaly segments
  // to a target anomalous fraction. Mutually exclusive with injections.
  MarkovAutoInjection auto_injection = 5;
}

message MarkovInjection {
  string segment_id = 1; // Nonempty and unique within the output stream.
  // Relative file path (resolved against the variant config file's directory) to a
  // separate QueryTemplateConfigs textproto whose scenario is markov_sampling and
  // which itself carries no injections (references never chain). During this
  // segment the walk runs that full anomaly graph on its own start spec.
  string anomaly_graph_path = 2;
  int64 start_action = 3; // Inclusive, zero-based.
  int64 num_actions = 4; // Positive; range must fit within --num_logs.
}

// Automatic anomaly-injection placement. The generator computes an anomalous budget
// of round(anomalous_fraction * num_logs) actions and greedily places non-overlapping
// segments (each length drawn uniformly from [min_actions, max_actions], clamped to the
// remaining budget and stream) separated by random gaps, selecting a referenced anomaly
// graph per segment by selection weights (uniform when unweighted). All placement draws
// come from the single seeded rng, so output is deterministic.
message MarkovAutoInjection {
  double anomalous_fraction = 1; // Target anomalous proportion, in [0.0, 1.0].
  repeated MarkovAutoAnomalyRef anomaly_refs = 2; // One or more; chosen per segment.
  int64 min_actions = 3; // Minimum segment length; >= 1.
  int64 max_actions = 4; // Maximum segment length; >= min_actions.
}

message MarkovAutoAnomalyRef {
  // Relative path to a plain markov_sampling graph (resolved and no-chaining checked
  // exactly like MarkovInjection.anomaly_graph_path).
  string anomaly_graph_path = 1;
  double selection_weight = 2; // Optional; finite, non-negative. Uniform when all unset.
}

// One vertex: a templated operation, a completion time, and its outgoing transitions.
message MarkovNode {
  string id = 1;                     // Non-empty, unique across nodes.
  QueryTemplateConfig template = 2;  // Reused unchanged.
  CompletionTime completion_time = 3;
  repeated MarkovEdge edges = 4;     // Outgoing transitions; empty => terminal node.
}

// A directed transition. The source is the containing MarkovNode.
message MarkovEdge {
  string destination_id = 1;
  double weight = 2;  // Finite, non-negative.
}

// Simulated time an operation takes; advances the simulated clock.
message CompletionTime {
  oneof duration_spec {
    google.protobuf.Duration fixed = 1;
    DurationRange range = 2;
  }
}

message DurationRange {
  google.protobuf.Duration min = 1;
  google.protobuf.Duration max = 2;
}

// Where each walk begins: a single node or a weighted distribution.
message MarkovStartNode {
  oneof start_spec {
    string node_id = 1;
    WeightedStartNodes distribution = 2;
  }
}

message WeightedStartNodes {
  repeated WeightedStartNode starts = 1;
}

message WeightedStartNode {
  string node_id = 1;
  double weight = 2;  // Finite, non-negative; distribution sums to > 0.
}

// Subtype: reuse a base graph (referenced by file path), replace specific edge
// weights, renormalize once.
message MarkovSubtypeConfig {
  // Path to the base graph's textproto config, resolved relative to the directory of
  // the variant config file. The referenced file must be a QueryTemplateConfigs whose
  // scenario is markov_sampling (a plain base graph), never a subtype/individual.
  string base_graph_path = 1;
  repeated EdgeWeightOverride edge_weight_overrides = 2;
}

// Replaces the base-graph weight of the edge identified by (source_id, destination_id).
message EdgeWeightOverride {
  string source_id = 1;
  string destination_id = 2;
  double weight = 3;  // Finite, non-negative.
}

// Individual: derive a per-individual graph from a class (base graph or subtype)
// via a per-edge precedence ladder that selects exactly one mechanism per non-pinned
// edge (never variance and jitter together), then one renormalization.
message MarkovIndividualConfig {
  // Path to the class's base graph textproto config, resolved relative to the directory
  // of the variant config file. Must reference a markov_sampling config.
  string base_graph_path = 1;

  // Optional subtype layer applied to the base graph before per-individual mechanisms.
  repeated EdgeWeightOverride subtype_overrides = 2;

  // (1) highest precedence: pins an edge's weight; skips variance/jitter.
  repeated EdgeWeightOverride individual_edge_overrides = 3;

  // (2) per-edge asymmetric two-sided range; sampled around the class weight for a
  // non-pinned edge with a positive down or up delta, which then skips jitter.
  repeated EdgeVariance edge_variances = 4;

  // (3) lowest precedence: one global bound applied only to non-pinned edges that have
  // no variance entry with a positive down or up delta.
  WeightJitter weight_jitter = 5;
}

// Per-edge asymmetric variance range keyed by (source_id, destination_id).
// The individual's weight is sampled uniformly over the closed interval
// [w - down, w + up], where w is the class (post-override) weight. The symmetric
// case is down == up. An entry with down == 0 && up == 0 is treated as no variance.
message EdgeVariance {
  string source_id = 1;
  string destination_id = 2;
  double down = 3;  // Downward delta; finite, non-negative.
  double up = 4;    // Upward delta; finite, non-negative.
}

message WeightJitter {
  double bound = 1;  // Finite, non-negative.
}

message WeightedSamplingConfig {
  repeated WeightedQueryTemplateConfig query_template_configs = 1;
}

message BucketSamplingConfig {
  repeated BucketQueryTemplateConfig query_template_configs = 1;
}

message WeightedQueryTemplateConfig {
  QueryTemplateConfig template = 1;

  // Relative weight for random sampling, governing the distribution between
  // normal and anomalous traffic.
  double probability_weight = 2;
}

message BucketQueryTemplateConfig {
  QueryTemplateConfig template = 1;
  BucketSimulationConfig bucket_config = 2;
}

message QueryTemplateConfig {
  // "SELECT * FROM my_table WHERE field1 = %v AND field2 = %v"
  string normalized_query_template = 1;

  // Define value-generation constraints specific to each placeholder.
  message PlaceholderValueSpec {
    message IntegerPlaceholder {
      int32 min = 1;
      int32 max = 2;
    }

    message FloatPlaceholder {
      double min = 1;
      double max = 2;
    }

    message StringPlaceholder {
      repeated string allowed_values = 1;
    }

    // Type-specific constraint specification.
    oneof placeholder {
      IntegerPlaceholder int_placeholder = 1;
      FloatPlaceholder float_placeholder = 2;
      StringPlaceholder string_placeholder = 3;
    }
  }

  repeated PlaceholderValueSpec placeholder_values = 2;

  // Ground truth label (true: anomalous, false: normal) used to evaluate
  // performance of unsupervised anomaly detection models.
  bool is_ground_truth_anomalous = 4;
}

message BucketSimulationConfig {
  string db_user = 1;

  // Baseline traffic simulation.
  double queries_per_bucket_mean = 2;
  double queries_variation_std_dev = 3;

  // Anomalous spike
  double anomalous_spike_probability = 4;
  double anomalous_spike_multiplier = 5;

  // false: Uniform distribution
  // true: Spiky/jittered distribution
  bool spiky_timestamps_distribution = 6;

  // Regular peak to simulate traffic variations in a day.
  repeated PeakWindow peak_windows = 7;

  // 0.0 represents a silent weekend (e.g., offices/clinics).
  // > 1.0 represents a busy weekend (e.g., restaurants/stores).
  optional double weekend_traffic_multiplier = 8;
}

message PeakWindow {
  string window_name = 1;  // "day", "night" or custom values
  int32 hour_start = 2;
  int32 hour_end = 3;
  double multiplier = 4;
}

// Connection log scenario. The simulated time range, train/test split and bucket size are set by the
// generator's existing --start_time_ms, --train_end_time_ms, --end_time_ms and
// --bucket_size_minutes flags.
message ConnectionSamplingConfig {
  // AlloyDB instance stamped on every generated ConnectionLogEntry.
  SourceInstance source = 1;

  repeated ClientProfile client_profiles = 2;
}

// One group of clients that connect the same way, e.g. an application server
// pool, a monitoring agent or an attacker.
message ClientProfile {
  // "billing-api", "internet-scanner" or custom values.
  string profile_name = 1;

  // Addresses the profile connects from. One is picked per connection.
  ClientAddressPool client_address_pool = 2;

  // Empty for profiles that never authenticate.
  string db_user = 3;
  string db_name = 4;
  string application_name = 5;

  // e.g. "trust" or "scram-sha-256".
  string auth_method = 6;

  // Relative weights of each connection outcome. Defaults to AUTHORIZED only
  // when empty.
  repeated OutcomeWeight outcome_weights = 7;

  // When connections happen.
  oneof schedule {
    // Steady traffic with peak hours and weekend behaviour. The "queries" fields
    // are read as connections per bucket; db_user is ignored.
    BucketSimulationConfig bucket_traffic = 8;

    // Fixed-interval connections, e.g. an internet scanner.
    PeriodicSchedule periodic = 9;

    // Rare high-volume bursts, e.g. an active attacker.
    BurstSchedule burst = 10;
  }

  // Part of the simulated time range the profile is active in.
  ActiveWindow active_window = 11;

  // Ground truth for every connection from this profile. Connections are
  // labeled anomalous when this is not ATTACKER_PROFILE_UNSPECIFIED.
  AttackerProfile attacker_profile = 12;
}

message ClientAddressPool {
  // Exact addresses, e.g. "10.0.0.12".
  repeated string addresses = 1;

  // Ranges a random address is drawn from, e.g. "203.0.113.0/24".
  repeated string cidr_ranges = 2;
}

message OutcomeWeight {
  ConnectionOutcome outcome = 1;
  double weight = 2;
}

message PeriodicSchedule {
  // Time between connections, e.g. 10 minutes.
  google.protobuf.Duration interval = 1;

  // Maximum random offset added to each connection time.
  google.protobuf.Duration jitter = 2;
}

message BurstSchedule {
  // Expected number of bursts per day while the profile is active.
  double bursts_per_day = 1;

  // Number of connections in one burst.
  double connections_per_burst_mean = 2;
  double connections_per_burst_std_dev = 3;

  // Time span one burst is spread across.
  google.protobuf.Duration burst_duration = 4;
}

enum ActiveWindow {
  // Treated as ACTIVE_WINDOW_ALL.
  ACTIVE_WINDOW_UNSPECIFIED = 0;

  // Active in both the training and test ranges.
  ACTIVE_WINDOW_ALL = 1;

  // Active only after --train_end_time_ms, e.g. a new attacker.
  ACTIVE_WINDOW_TEST_ONLY = 2;

  // Active only before --train_end_time_ms, e.g. a retired client.
  ACTIVE_WINDOW_TRAINING_ONLY = 3;
}
