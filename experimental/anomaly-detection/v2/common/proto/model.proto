syntax = "proto3";

package experimental.anomaly_detection.v2.common.proto;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/GoogleCloudPlatform/alloydb-omni-samples/experimental/anomaly-detection/v2/common/proto;commonpb";

// Scenario-1: Deviation from Regular Traffic Pattern
message TrafficDeviationModel {
  // Templates with probability >= anomaly threshold ratio.
  repeated string normal_templates = 1;

  // key: anomalous templates with probability < anomaly threshold ratio.
  // value: confidence score.
  map<string, double> anomaly_scores = 2;
}

message TrafficDeviationTrainingConfig {
  double anomaly_threshold_ratio = 1;
}

message TrafficDeviationScenario {
  TrafficDeviationModel model_data = 1;
  TrafficDeviationTrainingConfig config = 2;
}

message CycleBucketKey {
  string db_user = 1;
  string query_template = 2;

  // The relative index of the bucket within a cycle
  // (absolute_index % buckets_per_cycle).
  int64 bucket_index = 3;
}

message VolumetricBaseline {
  double mean = 1;
  double std_dev = 2;

  // mean + deviation_margin
  double upper_threshold = 3;

  // std_dev_multiplier * std_dev
  double deviation_margin = 4;
}

message VolumetricBaselineEntry {
  CycleBucketKey key = 1;
  VolumetricBaseline value = 2;
}

// Defines the temporal structure of a recurring cycle divided into buckets.
message CycleConfig {
  // The duration of a single bucket (e.g., 1 hour).
  google.protobuf.Duration bucket_duration = 1;

  // The duration of one complete cycle (e.g., 7 days for a weekly cycle).
  google.protobuf.Duration cycle_duration = 2;

  // Total number of buckets in one cycle
  // (cycle_duration / bucket_duration).
  int64 buckets_per_cycle = 3;
}

// Scenario-2: Severe Spikes of Read/Write Traffic
message VolumetricSpikeModel {
  repeated VolumetricBaselineEntry entries = 1;
  CycleConfig cycle_config = 2;
}

message VolumetricSpikeTrainingConfig {
  double std_dev_multiplier = 1;
  CycleConfig cycle_config = 2;
}

message VolumetricSpikeScenario {
  VolumetricSpikeModel model_data = 1;
  VolumetricSpikeTrainingConfig config = 2;
}

message TemporalSilentBucketEntry {
  CycleBucketKey key = 1;
  double confidence_score = 2;
}

// Scenario-3: Requests in Unexpected Time Frames
message TemporalDeviationModel {
  repeated TemporalSilentBucketEntry entries = 1;
  CycleConfig cycle_config = 2;
}

message TemporalDeviationTrainingConfig {
  double silent_threshold_ratio = 1;
  CycleConfig cycle_config = 2;
}

message TemporalDeviationScenario {
  TemporalDeviationModel model_data = 1;
  TemporalDeviationTrainingConfig config = 2;
}

// Empirical joint probabilities of consecutive normalized query templates.
// Only observed sequences are stored; omitted sequences have probability zero.
message NGramHistogramEntry {
  repeated string actions = 1;
  int64 count = 2;
  double probability = 3;
  // Absent when no complete training windows were observed.
  NGramWindowStatistics window_statistics = 4;
}

// Statistics of a category's proportion across nonoverlapping, complete windows.
// Zero occurrences are included. Variance uses the sample denominator K-1.
message NGramWindowStatistics {
  double mean = 1;
  // Absent when fewer than two complete windows were observed.
  optional double variance = 2;
}

message NGramHistogramDistribution {
  int32 n = 1;
  int64 total_windows = 2;
  repeated NGramHistogramEntry entries = 3;
}

message NGramHistogramModel {
  repeated NGramHistogramDistribution histograms = 1;
  int64 complete_windows = 2;
  // Included in overall counts, excluded from window statistics.
  int64 trailing_actions = 3;
}

message NGramHistogramTrainingConfig {
  // Count sizes 1 through max_n, inclusive. Must be in [1, 3].
  int32 max_n = 1;
  // Nonoverlapping window length in actions; must be >= max_n.
  // Omitted legacy configurations use 300. Explicit zero is invalid.
  optional int32 window_length = 2;
}

message NGramHistogramScenario {
  NGramHistogramModel model_data = 1;
  NGramHistogramTrainingConfig config = 2;
  // Added after training using an independent normal calibration stream.
  NGramCalibration calibration = 3;
}

message NGramCalibration {
  double percentile = 1;
  double threshold = 2;
  int64 complete_windows = 3;
  int64 total_actions = 4;
  int64 trailing_actions = 5;
  double score_mean = 6;
  double score_variance = 7; // Sample variance, denominator K-1.
  google.protobuf.Timestamp calibration_time = 8;
  // Identifies window length/order semantics and distance aggregation algorithm.
  string scoring_version = 9;
  NGramScoringConfig scoring_config = 10;
}

message NGramScoringConfig {
  // Effective sigma is max(learned sigma, this count / (window_length-n+1)).
  // A missing configuration defaults to 1 occurrence; explicit values must be
  // finite and positive. The same configuration is used for calibration/scoring.
  double standard_deviation_floor_count = 1;
}

message ModelMetadata {
  google.protobuf.Timestamp training_time = 1;
  string trainer_version = 2;

  google.protobuf.Timestamp data_start_time = 3;
  google.protobuf.Timestamp data_end_time = 4;
  int64 total_log_entries_processed = 5;

  // Optional CEL expression applied to filter log entries during model
  // training.
  string filter_cel_expression = 6;
}

// Wrapper wrapping all specific anomaly detection models.
message Model {
  oneof scenario {
    TrafficDeviationScenario traffic_deviation = 1;
    VolumetricSpikeScenario volumetric_spike = 2;
    TemporalDeviationScenario temporal_deviation = 3;
    NGramHistogramScenario ngram_histogram = 5;
  }

  optional ModelMetadata metadata = 4;
}
