syntax = "proto3";

package experimental.anomaly_detection.v2.prediction.proto;

import "v2/common/proto/anomaly_finding_entry.proto";
import "v2/common/proto/audit_log_entry.proto";
import "v2/common/proto/model.proto";

option go_package = "github.com/GoogleCloudPlatform/alloydb-omni-samples/experimental/anomaly-detection/v2/prediction_service/proto;predictionpb";

// Service for predicting anomalies.
service PredictionService {
  // Lists all available models.
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);

  // Predicts anomaly status and confidence score for audit log entries.
  rpc Predict(PredictRequest) returns (PredictResponse);

  // Pushes a new model to the prediction service.
  rpc PushModel(PushModelRequest) returns (PushModelResponse);

  // Fits a window-score threshold without changing the learned baseline.
  rpc CalibrateWindows(CalibrateWindowsRequest) returns (CalibrateWindowsResponse);

  // Scores complete, nonoverlapping validation windows using a calibrated model.
  rpc ScoreWindows(ScoreWindowsRequest) returns (WindowScoreReport);
}

message ModelMetadataFilter {
  // Optional. Exact match for trainer version.
  string trainer_version = 1;
}

message ModelFilter {
  // Optional. Filter by model metadata.
  ModelMetadataFilter metadata_filter = 1;

  // Optional. Filter models by scenario training config.
  oneof scenario_config_filter {
    experimental.anomaly_detection.v2.common.proto
        .TrafficDeviationTrainingConfig traffic_deviation = 2;
    experimental.anomaly_detection.v2.common.proto
        .VolumetricSpikeTrainingConfig volumetric_spike = 3;
    experimental.anomaly_detection.v2.common.proto
        .TemporalDeviationTrainingConfig temporal_deviation = 4;
    experimental.anomaly_detection.v2.common.proto
        .NGramHistogramTrainingConfig ngram_histogram = 5;
  }
}

message ListModelsRequest {
  // Optional. Find the model at the specified location.
  string model_location = 1;

  // Optional. Filter models used for listing.
  ModelFilter filter = 2;
}

message ModelEntry {
  string model_location = 1;
  experimental.anomaly_detection.v2.common.proto.ModelMetadata
      metadata = 3;

  oneof training_config {
    experimental.anomaly_detection.v2.common.proto
        .TrafficDeviationTrainingConfig traffic_deviation_config = 4;
    experimental.anomaly_detection.v2.common.proto
        .VolumetricSpikeTrainingConfig volumetric_spike_config = 5;
    experimental.anomaly_detection.v2.common.proto
        .TemporalDeviationTrainingConfig temporal_deviation_config = 6;
    experimental.anomaly_detection.v2.common.proto
        .NGramHistogramTrainingConfig ngram_histogram_config = 7;
  }
}

message ListModelsResponse {
  repeated ModelEntry models = 1;
}

message AuditLogBatch {
  repeated experimental.anomaly_detection.v2.common.proto.AuditLogEntry
      log_entries = 1;
}

// Request payload for anomaly prediction.
// Supports real-time (single/batch) and offline (file-based) inputs.
message PredictRequest {
  oneof payload {
    experimental.anomaly_detection.v2.common.proto.AuditLogEntry
        single_log = 1;
    AuditLogBatch batch_logs = 2;
    string predict_log_path = 3;
  }

  // Optional. Find the model at the specified location.
  string model_location = 4;

  // Optional. Filter models used for prediction.
  ModelFilter filter = 5;
}

message AnomalyFindingBatch {
  repeated experimental.anomaly_detection.v2.common.proto.AnomalyFinding
      findings = 1;
}

// Structured findings from anomaly prediction.
message PredictResponse {
  oneof result {
    experimental.anomaly_detection.v2.common.proto.AnomalyFinding
        single_finding = 1;
    AnomalyFindingBatch batch_findings = 2;
    string findings_path = 3;
  }
}

message PushModelRequest {
  string model_location = 1;
  experimental.anomaly_detection.v2.common.proto.Model model = 2;
}

message PushModelResponse {}

message NGramDistance {
  int32 n = 1;
  double distance = 2; // Jensen-Shannon distance, base 2, in [0, 1].
}

message NGramOrderScore {
  int32 n = 1;
  double score = 2; // RMS standardized deviation for this order.
  int64 category_count = 3; // Known categories plus one fixed unknown bucket.
  int64 unknown_occurrences = 4;
}

message NGramDeviation {
  int32 n = 1;
  repeated string actions = 2; // Empty for the aggregated unknown bucket.
  bool is_unknown_bucket = 3;
  double observed_proportion = 4;
  double learned_mean = 5;
  double learned_variance = 6;
  double effective_standard_deviation = 7;
  double standardized_deviation = 8; // Signed: increased/decreased frequency.
  double squared_deviation = 9;
  // Contribution to the final score squared; used to rank explanations.
  double score_contribution = 10;
}

message WindowScore {
  int64 window_index = 1; // Zero-based.
  int64 start_action = 2; // Inclusive, zero-based record position.
  int64 end_action = 3; // Exclusive.
  repeated NGramDistance distances = 4 [deprecated = true]; // Legacy JS only.
  double score = 5; // sqrt(mean of per-order mean squared standardized deviations).
  // Absent for calibration windows, which have no threshold yet.
  optional bool is_anomalous = 6;
  repeated NGramOrderScore order_scores = 7;
  repeated NGramDeviation top_deviations = 8; // Largest ten contributions.
}

message WindowScoreReport {
  int32 window_length = 1;
  int64 total_actions = 2;
  int64 complete_windows = 3;
  int64 trailing_actions = 4; // Not scored.
  repeated WindowScore windows = 5;
  optional double threshold = 6;
  string scoring_version = 7;
  experimental.anomaly_detection.v2.common.proto.NGramScoringConfig scoring_config = 8;
}

message CalibrateWindowsRequest {
  string model_location = 1;
  string calibration_log_path = 2;
  double percentile = 3; // In (0, 1); nearest-rank empirical quantile.
  string output_model_location = 4; // Must differ from the original model.
  experimental.anomaly_detection.v2.common.proto.NGramScoringConfig scoring_config = 5;
}

message CalibrateWindowsResponse {
  string model_location = 1;
  experimental.anomaly_detection.v2.common.proto.NGramCalibration calibration = 2;
  WindowScoreReport scores = 3;
}

message ScoreWindowsRequest {
  string model_location = 1;
  string validation_log_path = 2;
}
